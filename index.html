<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNOTE - Digital Note-Taking App</title>
  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <!-- Atrament.js for Drawing -->
  <script src="https://cdn.jsdelivr.net/npm/atrament@1.0.0/dist/atramen.min.js"></script>
  <!-- jsPDF for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- PDF.js for PDF Import -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  
  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#4f46e5',
            secondary: '#6366f1',
            accent: '#8b5cf6',
            success: '#10b981',
            warning: '#f59e0b',
            error: '#ef4444',
            info: '#3b82f6',
            light: '#f3f4f6',
            dark: '#1f2937'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'inner-lg': 'inset 0 2px 10px 0 rgba(0, 0, 0, 0.1)',
          }
        }
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .transition-height {
        transition: max-height 0.3s ease-in-out;
      }
    }
    
    /* Custom styles */
    .tool-btn.active {
      @apply bg-primary text-white;
    }
    
    .canvas-container {
      touch-action: none;
    }
    
    .note-item {
      transition: all 0.2s ease;
    }
    
    .note-item:hover {
      transform: translateY(-1px);
    }
    
    .notification {
      transition: all 0.3s ease;
    }
  </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">
  <!-- Header -->
  <header class="bg-white border-b border-gray-200 py-3 px-4 flex items-center justify-between">
    <div class="flex items-center">
      <div class="text-primary font-bold text-2xl mr-2">
        <i class="fa fa-sticky-note-o"></i>
      </div>
      <h1 class="text-xl font-bold text-gray-800">DNOTE</h1>
    </div>
    
    <div class="flex items-center space-x-4">
      <button id="new-note-btn" class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg flex items-center transition-all">
        <i class="fa fa-plus mr-2"></i> New Note
      </button>
      
      <div class="relative">
        <button class="text-gray-500 hover:text-gray-700">
          <i class="fa fa-bell-o text-xl"></i>
        </button>
      </div>
      
      <div class="relative">
        <button class="text-gray-500 hover:text-gray-700">
          <i class="fa fa-cog text-xl"></i>
        </button>
      </div>
      
      <div class="w-8 h-8 rounded-full bg-gray-300 flex items-center justify-center text-gray-700">
        <i class="fa fa-user"></i>
      </div>
    </div>
  </header>
  
  <!-- Main Content -->
  <main class="flex flex-1 overflow-hidden">
    <!-- Left Sidebar - Navigation -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
      <nav class="p-4 flex-1">
        <ul class="space-y-2">
          <li>
            <a id="nav-all-notes" href="#" class="flex items-center px-4 py-2 rounded-lg bg-primary/10 text-primary">
              <i class="fa fa-list-ul w-5 mr-3"></i>
              <span>All Notes</span>
            </a>
          </li>
          <li>
            <a id="nav-recent" href="#" class="flex items-center px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100">
              <i class="fa fa-clock-o w-5 mr-3"></i>
              <span>Recent</span>
            </a>
          </li>
          <li>
            <a id="nav-starred" href="#" class="flex items-center px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100">
              <i class="fa fa-star-o w-5 mr-3"></i>
              <span>Starred</span>
            </a>
          </li>
          <li>
            <a id="nav-trash" href="#" class="flex items-center px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100">
              <i class="fa fa-trash-o w-5 mr-3"></i>
              <span>Trash</span>
            </a>
          </li>
        </ul>
        
        <div class="mt-8">
          <h3 class="px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Categories</h3>
          <ul class="space-y-1">
            <li>
              <a href="#" class="flex items-center px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100">
                <span class="w-2 h-2 rounded-full bg-blue-500 mr-3"></span>
                <span>Work</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100">
                <span class="w-2 h-2 rounded-full bg-green-500 mr-3"></span>
                <span>Personal</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100">
                <span class="w-2 h-2 rounded-full bg-purple-500 mr-3"></span>
                <span>Projects</span>
              </a>
            </li>
            <li>
              <a href="#" class="flex items-center px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100">
                <span class="w-2 h-2 rounded-full bg-yellow-500 mr-3"></span>
                <span>Ideas</span>
              </a>
            </li>
          </ul>
        </div>
      </nav>
      
      <div class="p-4 border-t border-gray-200">
        <button class="flex items-center text-gray-700 hover:text-primary">
          <i class="fa fa-plus-circle mr-2"></i>
          <span>Add Category</span>
        </button>
      </div>
    </aside>
    
    <!-- Middle Section - Notes List -->
    <section class="w-80 bg-gray-50 border-r border-gray-200 flex flex-col">
      <div class="p-4 border-b border-gray-200">
        <div class="relative">
          <input type="text" placeholder="Search notes..." class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
          <i class="fa fa-search absolute left-3 top-3 text-gray-400"></i>
        </div>
      </div>
      
      <div class="flex-1 overflow-y-auto p-4" id="notes-list">
        <!-- Notes will be dynamically added here -->
      </div>
    </section>
    
    <!-- Right Section - Note Editor -->
    <section class="flex-1 flex flex-col bg-white">
      <!-- Note Editor Header -->
      <div class="p-4 border-b border-gray-200 flex items-center justify-between">
        <div class="flex-1">
          <input type="text" id="note-title" placeholder="Note title..." class="w-full text-xl font-medium border-none outline-none bg-transparent">
        </div>
        
        <div class="flex items-center space-x-2">
          <button id="import-pdf-btn" class="text-gray-600 hover:text-primary p-2 rounded-lg hover:bg-gray-100">
            <i class="fa fa-file-pdf-o"></i>
          </button>
          <button id="export-pdf-btn" class="text-gray-600 hover:text-primary p-2 rounded-lg hover:bg-gray-100">
            <i class="fa fa-download"></i>
          </button>
          <button id="star-note-btn" class="text-gray-600 hover:text-yellow-500 p-2 rounded-lg hover:bg-gray-100">
            <i class="fa fa-star-o"></i>
          </button>
        </div>
      </div>
      
      <!-- Drawing Tools -->
      <div class="p-2 border-b border-gray-200 flex items-center justify-between bg-gray-50">
        <div class="flex items-center space-x-1">
          <button class="tool-btn active p-2 rounded-lg hover:bg-gray-200" data-tool="pen">
            <i class="fa fa-pencil"></i>
          </button>
          <button class="tool-btn p-2 rounded-lg hover:bg-gray-200" data-tool="eraser">
            <i class="fa fa-eraser"></i>
          </button>
          <button class="tool-btn p-2 rounded-lg hover:bg-gray-200" data-tool="text">
            <i class="fa fa-font"></i>
          </button>
          
          <div class="h-6 border-r border-gray-300 mx-1"></div>
          
          <div class="relative">
            <button id="color-picker-btn" class="p-2 rounded-lg hover:bg-gray-200">
              <i class="fa fa-paint-brush"></i>
            </button>
            
            <div id="color-picker" class="hidden absolute bottom-full left-0 mb-2 p-2 bg-white rounded-lg shadow-lg border border-gray-200 z-10">
              <div class="grid grid-cols-6 gap-2">
                <button data-color="#000000" class="w-6 h-6 rounded-full bg-black"></button>
                <button data-color="#4f46e5" class="w-6 h-6 rounded-full bg-primary"></button>
                <button data-color="#10b981" class="w-6 h-6 rounded-full bg-green-500"></button>
                <button data-color="#ef4444" class="w-6 h-6 rounded-full bg-red-500"></button>
                <button data-color="#f59e0b" class="w-6 h-6 rounded-full bg-yellow-500"></button>
                <button data-color="#8b5cf6" class="w-6 h-6 rounded-full bg-purple-500"></button>
                <button data-color="#3b82f6" class="w-6 h-6 rounded-full bg-blue-500"></button>
                <button data-color="#ec4899" class="w-6 h-6 rounded-full bg-pink-500"></button>
                <button data-color="#14b8a6" class="w-6 h-6 rounded-full bg-teal-500"></button>
                <button data-color="#f97316" class="w-6 h-6 rounded-full bg-orange-500"></button>
                <button data-color="#6b7280" class="w-6 h-6 rounded-full bg-gray-500"></button>
                <button data-color="#ffffff" class="w-6 h-6 rounded-full bg-white border border-gray-300"></button>
              </div>
            </div>
          </div>
          
          <div class="relative">
            <button id="line-width-btn" class="p-2 rounded-lg hover:bg-gray-200">
              <i class="fa fa-arrows-h"></i>
            </button>
            
            <div id="line-width-picker" class="hidden absolute bottom-full left-0 mb-2 p-3 bg-white rounded-lg shadow-lg border border-gray-200 z-10">
              <input type="range" id="line-width-slider" min="1" max="10" value="2" class="w-24">
            </div>
          </div>
        </div>
        
        <div class="flex items-center space-x-1">
          <button id="undo-btn" class="p-2 rounded-lg hover:bg-gray-200 text-gray-600">
            <i class="fa fa-undo"></i>
          </button>
          <button id="redo-btn" class="p-2 rounded-lg hover:bg-gray-200 text-gray-600">
            <i class="fa fa-repeat"></i>
          </button>
          <button id="clear-canvas-btn" class="p-2 rounded-lg hover:bg-gray-200 text-gray-600">
            <i class="fa fa-trash-o"></i>
          </button>
        </div>
      </div>
      
      <!-- Canvas Container -->
      <div class="flex-1 overflow-hidden relative">
        <div id="canvas-container" class="w-full h-full canvas-container">
          <canvas id="drawing-canvas" class="w-full h-full"></canvas>
          
          <!-- Empty State -->
          <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400">
            <i class="fa fa-pencil text-5xl mb-3"></i>
            <h3 class="text-xl font-medium mb-1">Start Drawing</h3>
            <p class="text-sm">Create a new note or select one from the list</p>
          </div>
        </div>
      </div>
    </section>
  </main>
  
  <!-- Import PDF Modal -->
  <div id="import-pdf-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-medium">Import PDF</h3>
        <button id="close-import-modal" class="text-gray-500 hover:text-gray-700">
          <i class="fa fa-times"></i>
        </button>
      </div>
      
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Select PDF File</label>
        <input type="file" id="pdf-file-input" accept=".pdf" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
        <p id="selected-file-name" class="mt-1 text-sm text-gray-500"></p>
      </div>
      
      <div id="import-status" class="hidden mb-4 p-3 bg-blue-50 text-blue-700 rounded-lg flex items-center">
        <i class="fa fa-spinner fa-spin mr-2"></i>
        <span>Loading PDF...</span>
      </div>
      
      <div class="flex justify-end space-x-3">
        <button id="cancel-import" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
          Cancel
        </button>
        <button id="confirm-import" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90" disabled>
          Import
        </button>
      </div>
    </div>
  </div>
  
  <!-- Export PDF Modal -->
  <div id="export-pdf-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-medium">Export PDF</h3>
        <button id="close-export-modal" class="text-gray-500 hover:text-gray-700">
          <i class="fa fa-times"></i>
        </button>
      </div>
      
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">File Name</label>
        <input type="text" id="export-file-name" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary" value="My Note">
      </div>
      
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Page Range</label>
        <div class="space-y-2">
          <div class="flex items-center">
            <input type="radio" id="all-pages" name="page-range" value="all" checked class="mr-2">
            <label for="all-pages">All Pages</label>
          </div>
          <div class="flex items-center">
            <input type="radio" id="current-page" name="page-range" value="current" class="mr-2">
            <label for="current-page">Current Page</label>
          </div>
          <div class="flex items-center">
            <input type="radio" id="custom-range" name="page-range" value="custom" class="mr-2">
            <label for="custom-range">Custom Range</label>
          </div>
          <div id="custom-page-range" class="hidden ml-6 mt-2">
            <input type="text" placeholder="e.g., 1-3,5" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
          </div>
        </div>
      </div>
      
      <div id="export-status" class="hidden mb-4 p-3 bg-blue-50 text-blue-700 rounded-lg flex items-center">
        <i class="fa fa-spinner fa-spin mr-2"></i>
        <span>Generating PDF...</span>
      </div>
      
      <div class="flex justify-end space-x-3">
        <button id="cancel-export" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
          Cancel
        </button>
        <button id="confirm-export" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90">
          Export
        </button>
      </div>
    </div>
  </div>
  
  <!-- Notification -->
  <div id="notification" class="fixed bottom-4 right-4 bg-white rounded-lg shadow-lg p-4 w-80 transform translate-y-10 opacity-0 transition-all duration-300 z-50">
    <div class="flex items-start">
      <div id="notification-icon" class="flex-shrink-0 mr-3 text-green-500">
        <i class="fa fa-check-circle text-xl"></i>
      </div>
      <div class="flex-1">
        <h4 id="notification-title" class="font-medium text-gray-900">Success</h4>
        <p id="notification-message" class="text-sm text-gray-600 mt-1">Operation completed successfully.</p>
      </div>
      <button id="close-notification" class="text-gray-400 hover:text-gray-600 ml-4">
        <i class="fa fa-times"></i>
      </button>
    </div>
  </div>
  
  <!-- JavaScript Files -->
  <script src="js/app.js"></script>
  <script src="js/pdf-utils.js"></script>
  <script src="js/debug.js"></script>
</body>
</html>
